name: PicoParquet build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ integration/picocompress-codecs ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PicoParquet
        uses: actions/checkout@v4
        with:
          path: picoparquet
      - name: Checkout PicoCompress
        uses: actions/checkout@v4
        with:
          repository: WillEastbury/picocompress
          path: picocompress
      - name: Configure
        shell: bash
        run: >-
          cmake -S picoparquet -B build
          -DPICOPARQUET_BUILD_TESTS=ON
          -DPICOPARQUET_WITH_PICOCOMPRESS=ON
          -DPICOCOMPRESS_ROOT="$GITHUB_WORKSPACE/picocompress"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
